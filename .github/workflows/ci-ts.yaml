name: CI-ts

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Node and pnpm versions come from .mise.toml; the package manager is detected from the lockfile.
  ts-checks:
    uses: zondax/_workflows/.github/workflows/_checks-ts.yaml@v6
    with:
      enable_tests: false # Tests need Docker, see test-with-docker
      enable_coverage: false
      lint_command: "check"
      format_command: "check"

  test-with-docker:
    runs-on: ubuntu-latest
    needs: ts-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with Docker
        run: pnpm test
